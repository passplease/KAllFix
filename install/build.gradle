// 2. 为 java21 源码集单独配置 Java 21 的工具链
java {
    toolchain {
        // 主代码使用 Java 17
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 3. 强制 java21 源码集使用 Java 21 编译
tasks.named('compileJava21Java') {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarOutputStream

// 创建自定义任务 splitJar
tasks.register('splitJar') {
    var taskName = ':_createAllJar'//':jar'//':jarjar'
    var taskNameNeo = ':neoforge_1.21:jar'//':jar'//':jarjar'
    // 执行任务时的操作
    dependsOn(taskName)
    dependsOn(taskNameNeo)
    doLast {
        def outputPath = file("build")
        outputPath.mkdirs()

        // 删除旧的目标 JAR 文件并创建新文件
        def baseJar = new File(outputPath, "k_multi_threading-base.jar")
        def asmJar = new File(outputPath, "k_multi_threading-asm.jar")
        baseJar.delete()
        asmJar.delete()
        baseJar.createNewFile()
        asmJar.createNewFile()

        // 定义复制和移动的文件列表
        def copy = []
        def mov = [
                "K_multi_threading.mapping",
                "asm/n1luik/K_multi_threading",
                "asm/n1luik/KAllFix",
                "asm/KAllFix.fix/",
                "META-INF/services"
        ]
        def notNeo = [
                "META-INF/services",
                "META-INF/MANIFEST.MF",
        ]

        // 打开源 JAR 文件
        def parentTask = tasks.getByPath(taskName)
        def parentTaskNeo = tasks.getByPath(taskNameNeo)
        def sourceJarPath = new File(parentTask.destinationDirectory.get().asFile, "all.jar")
        def sourceJarPathNeo = new File(parentTaskNeo.destinationDirectory.get().asFile, "neo21-1.0.jar")
        def sourceJar = new JarFile(sourceJarPath)
        def sourceJarNeo = new JarFile(sourceJarPathNeo)
        def jarBase = new JarOutputStream(new FileOutputStream(baseJar))
        def jarAsm = new JarOutputStream(new FileOutputStream(asmJar))

        def names = []
        def names2 = []

        // 遍历源 JAR 文件中的所有条目
        sourceJarNeo.entries().each { JarEntry jarEntry ->
            def name = jarEntry.getName()
            if (name.endsWith("/")) return
            // 处理复制列表
            def isNot = false
            notNeo.each { s ->
                if (name.startsWith(s) && !names.contains(name)) {
                    isNot = true
                }
            }
            if (isNot) return

            // 处理移动列表
            mov.each { s ->
                if (name.startsWith(s)) {
                    if (!names.contains(name)) {
                        names.add(name)
                        jarAsm.putNextEntry(jarEntry)
                        jarAsm.write(sourceJarNeo.getInputStream(jarEntry).bytes)
                    }
                    isNot = true
                }
            }
            if (isNot) return

            names2.add(name)
            jarBase.putNextEntry(jarEntry)
            jarBase.write(sourceJarNeo.getInputStream(jarEntry).bytes)
        }
        sourceJar.entries().each { JarEntry jarEntry ->
            def name = jarEntry.getName()
            if (name.endsWith("/")) return

            // 处理复制列表
            def shouldCopyToAsm = false
            copy.each { s ->
                if (name.startsWith(s) && !names.contains(name)) {
                    names.add(name)
                    jarAsm.putNextEntry(jarEntry)
                    jarAsm.write(sourceJar.getInputStream(jarEntry).bytes)
                    shouldCopyToAsm = true
                }
            }

            // 处理移动列表
            mov.each { s ->
                if (name.startsWith(s)) {
                    if (!names.contains(name)) {
                        names.add(name)
                        jarAsm.putNextEntry(jarEntry)
                        jarAsm.write(sourceJar.getInputStream(jarEntry).bytes)
                    }
                    shouldCopyToAsm = true
                }
            }

            // 处理基础 JAR 文件
            if (!shouldCopyToAsm && !names2.contains(name)) {
                names2.add(name)
                jarBase.putNextEntry(jarEntry)
                jarBase.write(sourceJar.getInputStream(jarEntry).bytes)
            }
        }

        // 关闭流
        jarBase.close()
        jarAsm.close()
        sourceJar.close()
    }
}

tasks.test {
    useJUnitPlatform()
}


tasks.jar {
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    dependsOn('splitJar')
    from file("build/k_multi_threading-base.jar") //{
        //rename { String fileName -> "KMT.jar"
//
        //}
    //}
    //if (Boolean.getBoolean("install_package")){
    //    from files(tasks.getByPath(":jar").outputs) {
    //        rename { String fileName -> "KMT_ALL.jar"
//
    //        }
    //    }
    //}
    from zipTree(files("build/k_multi_threading-asm.jar").first())
