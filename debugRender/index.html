<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>InfRunPos 数据渲染器</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --zoom: 1;
    --font-size: 12px;
  }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Arial, sans-serif;
    background: #fafafa;
    color: #222;
  }
  body {
    font-size: calc(var(--font-size) * var(--zoom));
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #2b2b2b;
    color: #eee;
    padding: 8px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .toolbar button, .toolbar label.btn {
    background: #444;
    color: #eee;
    border: 1px solid #666;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    user-select: none;
  }
  .toolbar button:hover, .toolbar label.btn:hover { background: #555; }
  .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar input[type="file"] { display: none; }
  .status {
    margin-left: auto;
    color: #bbb;
    font-size: 12px;
    font-family: Consolas, Monaco, monospace;
  }
  .content {
    padding: 12px;
    min-height: calc(100vh - 50px);
  }
  .empty {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 16px;
    border: 2px dashed #ddd;
    border-radius: 8px;
    margin: 20px;
  }
  .empty.dragover { background: #e8f4ff; border-color: #66aaff; }
  .file-section {
    margin-bottom: 24px;
  }
  .file-header {
    background: #fff;
    border: 1px solid #ddd;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .file-header h2 {
    margin: 0;
    font-size: 1.1em;
    word-break: break-all;
  }
  .file-header .meta {
    color: #666;
    font-size: 0.9em;
  }
  .threads {
    background: #fff;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 8px;
  }
  .thread {
    margin-bottom: 12px;
    background: #fcfcfc;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
  }
  .thread:last-child { margin-bottom: 0; }
  .thread-header {
    padding: 6px 10px;
    background: #f0f0f0;
    border-bottom: 1px solid #e0e0e0;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 3px 3px 0 0;
  }
  .thread-header:hover { background: #e8e8e8; }
  .thread.collapsed .thread-body { display: none; }
  .thread.collapsed .thread-header { border-bottom: none; border-radius: 3px; }
  .thread-meta { color: #666; font-size: 0.9em; font-weight: normal; }
  .thread-body {
    padding: 6px 10px;
    max-height: 70vh;
    overflow: auto;
  }
  .tree-node {
    margin-left: 14px;
    position: relative;
    line-height: 1.6;
  }
  .tree-node.root { margin-left: 0; }
  .tree-node-content {
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 2px;
    display: inline-block;
    max-width: 100%;
    word-break: break-all;
  }
  .tree-node-content:hover { background: #eaf2ff; }
  .tree-node.root > .tree-node-content {
    color: #999;
    font-style: italic;
  }
  .tree-node-content .toggle {
    display: inline-block;
    width: 1em;
    color: #888;
    user-select: none;
    font-size: 0.85em;
  }
  .tree-node-content .method {
    color: #0a5fb3;
    font-family: Consolas, "Courier New", Monaco, monospace;
    font-size: 0.95em;
  }
  .tree-node-content .count {
    color: #999;
    margin-left: 4px;
    font-size: 0.9em;
  }
  .tree-node.collapsed > .tree-children { display: none; }
  .tree-children {
    border-left: 1px dotted #ddd;
    margin-left: 6px;
    padding-left: 4px;
  }
  .progress {
    background: #fff8d8;
    color: #6b5b00;
    padding: 6px 10px;
    border: 1px solid #f0e08a;
    border-radius: 3px;
    margin: 6px 0;
    font-family: Consolas, Monaco, monospace;
    font-size: 0.95em;
  }
  .error {
    background: #fde8e8;
    color: #8a1f1f;
    padding: 6px 10px;
    border: 1px solid #f0b8b8;
    border-radius: 3px;
    margin: 6px 0;
  }
  .legend {
    color: #888;
    font-size: 0.85em;
    padding: 4px 10px;
  }
  .speed-section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 12px;
    padding: 8px 12px;
  }
  .speed-section summary {
    cursor: pointer;
    color: #444;
    font-weight: 600;
    padding: 4px 0;
    user-select: none;
  }
  .speed-section .speed-stats { color: #666; font-size: 0.9em; }
</style>
</head>
<body>

<div class="toolbar">
  <label class="btn" for="file-input">选择文件</label>
  <input type="file" id="file-input" accept="*/*" multiple>
  <button id="zoom-out" title="缩小 (Ctrl + -)">−</button>
  <button id="zoom-reset" title="重置 (Ctrl + 0)">100%</button>
  <button id="zoom-in" title="放大 (Ctrl + =)">+</button>
  <button id="collapse-all">全部折叠</button>
  <button id="expand-all-1">展开一层</button>
  <button id="expand-all">全部展开</button>
  <button id="hex-dump" title="显示文件前 256 字节">Hex Dump</button>
  <button id="debug-tree" title="显示第一个线程的树结构">调试树</button>
  <span class="status" id="status">就绪</span>
</div>

<div class="content" id="content">
  <div class="empty" id="drop-zone">
    请选择或拖放一个/多个 InfRunPos 数据文件<br>
    <small>（zip 已手动解压后的二进制文件，大端序，UTF-8）</small>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 配置
// ============================================================
const ZOOM_MIN = 0.2;
const ZOOM_MAX = 5;
const CHUNK_SIZE = 4 * 1024 * 1024; // 4MB 读盘块
let zoomLevel = 1;

// ============================================================
// DOM 工具
// ============================================================
const $ = (id) => document.getElementById(id);

function setZoom(z) {
  zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  document.documentElement.style.setProperty('--zoom', zoomLevel);
  $('zoom-reset').textContent = Math.round(zoomLevel * 100) + '%';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// 采样速度日志工具
// ============================================================
function speedStats(speedLog) {
  if (!speedLog || speedLog.length === 0) return null;
  let min = Infinity, max = -Infinity, sum = 0;
  for (const s of speedLog) {
    if (s.rate < min) min = s.rate;
    if (s.rate > max) max = s.rate;
    sum += s.rate;
  }
  return {
    count: speedLog.length,
    min,
    max,
    avg: Math.round(sum / speedLog.length),
    durationMs: speedLog[speedLog.length - 1].timeMs - speedLog[0].timeMs
  };
}

function renderSpeed(speedLog) {
  const det = document.createElement('details');
  det.className = 'speed-section';
  const st = speedStats(speedLog);
  const summary = document.createElement('summary');
  if (!st) {
    summary.textContent = '记录速度：此文件没有速度数据（旧格式文件）';
    det.appendChild(summary);
    return det;
  }
  summary.textContent = `记录速度：平均每秒记录 ${st.avg} 次（最快 ${st.max} 次/秒，最慢 ${st.min} 次/秒），共观察 ${(st.durationMs / 1000).toFixed(1)} 秒`;
  det.appendChild(summary);

  const W = 900, H = 200, PAD = 28;
  const durS = Math.max(st.durationMs / 1000, 1);
  const range = (st.max - st.min) || 1;
  const step = Math.max(1, Math.floor(speedLog.length / 2000));
  const pts = [];
  for (let i = 0; i < speedLog.length; i += step) {
    const relMs = speedLog[i].timeMs - speedLog[0].timeMs;
    const x = PAD + (relMs / 1000 / durS) * (W - 2 * PAD);
    const y = H - PAD - ((speedLog[i].rate - st.min) / range) * (H - 2 * PAD);
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
  }
  const avgY = H - PAD - ((st.avg - st.min) / range) * (H - 2 * PAD);
  const body = document.createElement('div');
  body.className = 'speed-stats';
  body.innerHTML = `
    <div>说明：记录速度 = 这个工具每秒记录了多少次线程快照。值越高，说明采样越频繁。</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;height:auto;background:#fff;border:1px solid #eee;border-radius:3px;display:block;">
      <line x1="${PAD}" y1="${avgY}" x2="${W - PAD}" y2="${avgY}" stroke="#e0a030" stroke-dasharray="4 3"/>
      <text x="${W - PAD}" y="${avgY - 4}" text-anchor="end" font-size="10" fill="#b08020">平均 ${st.avg} 次/秒</text>
      <polyline fill="none" stroke="#2d6cdf" stroke-width="1" points="${pts.join(' ')}"/>
      <text x="${PAD}" y="${H - 6}" font-size="10" fill="#888">横轴：时间（秒），从 0 到 ${durS.toFixed(0)}</text>
      <text x="${W - PAD}" y="12" text-anchor="end" font-size="10" fill="#888">纵轴：记录速度（次/秒）</text>
    </svg>`;
  det.appendChild(body);
  return det;
}

// ============================================================
// Java Modified UTF-8 解码器
// 与标准 UTF-8 的差异：
// 1. null 字节 (U+0000) 编码为 0xC0 0x80（而非 0x00）
// 2. 补充字符 (U+10000+) 用 CESU-8 风格：拆成 surrogate pair，每个 surrogate 用 3 字节编码
// ============================================================
function decodeModifiedUtf8(buf, offset, length) {
  const end = offset + length;
  let result = '';
  let i = offset;
  while (i < end) {
    const b0 = buf[i];
    if (b0 === 0xC0 && i + 1 < end && buf[i + 1] === 0x80) {
      // Modified UTF-8 的 null 字节
      result += '\0';
      i += 2;
    } else if (b0 < 0x80) {
      // 单字节 ASCII
      result += String.fromCharCode(b0);
      i += 1;
    } else if ((b0 & 0xE0) === 0xC0) {
      // 双字节
      const b1 = buf[i + 1];
      result += String.fromCharCode(((b0 & 0x1F) << 6) | (b1 & 0x3F));
      i += 2;
    } else if ((b0 & 0xF0) === 0xE0) {
      // 三字节
      const b1 = buf[i + 1];
      const b2 = buf[i + 2];
      const cp = ((b0 & 0x0F) << 12) | ((b1 & 0x3F) << 6) | (b2 & 0x3F);
      // 检查是否是 CESU-8 surrogate pair 的前半部分
      if (cp >= 0xD800 && cp <= 0xDBFF && i + 6 <= end) {
        const b3 = buf[i + 3];
        const b4 = buf[i + 4];
        const b5 = buf[i + 5];
        if ((b3 & 0xF0) === 0xE0) {
          const cp2 = ((b3 & 0x0F) << 12) | ((b4 & 0x3F) << 6) | (b5 & 0x3F);
          if (cp2 >= 0xDC00 && cp2 <= 0xDFFF) {
            // 合并为补充字符
            const codePoint = 0x10000 + ((cp - 0xD800) << 10) + (cp2 - 0xDC00);
            result += String.fromCodePoint(codePoint);
            i += 6;
            continue;
          }
        }
      }
      result += String.fromCharCode(cp);
      i += 3;
    } else if ((b0 & 0xF8) === 0xF0) {
      // 标准 UTF-8 四字节（理论上 Modified UTF-8 不用，但兼容处理）
      const b1 = buf[i + 1];
      const b2 = buf[i + 2];
      const b3 = buf[i + 3];
      const cp = ((b0 & 0x07) << 18) | ((b1 & 0x3F) << 12) | ((b2 & 0x3F) << 6) | (b3 & 0x3F);
      result += String.fromCodePoint(cp);
      i += 4;
    } else {
      // 非法字节，跳过
      i += 1;
    }
  }
  return result;
}

// ============================================================
// 流式二进制读取（分块读盘，避免一次性加载大文件）
// ============================================================
class StreamReader {
  constructor(file, chunkSize = CHUNK_SIZE) {
    this.file = file;
    this.chunkSize = chunkSize;
    this.filePos = 0;
    this.capacity = chunkSize;
    this.buf = new Uint8Array(this.capacity);
    this.bufLen = 0;
  }

  async _fill(n) {
    while (this.bufLen < n) {
      if (this.filePos >= this.file.size) {
        throw new Error(`文件意外结束：还需 ${n} 字节，缓冲仅剩 ${this.bufLen}`);
      }
      if (this.bufLen > 0) this.buf.copyWithin(0, 0, this.bufLen);
      const end = Math.min(this.filePos + this.chunkSize, this.file.size);
      const chunk = new Uint8Array(await this.file.slice(this.filePos, end).arrayBuffer());
      this.filePos = end;
      const needed = this.bufLen + chunk.length;
      if (needed > this.capacity) {
        const newCap = Math.max(needed, this.capacity * 2);
        const nb = new Uint8Array(newCap);
        nb.set(this.buf.subarray(0, this.bufLen), 0);
        this.buf = nb;
        this.capacity = newCap;
      }
      this.buf.set(chunk, this.bufLen);
      this.bufLen += chunk.length;
    }
  }

  _consume(n) {
    if (n > this.bufLen) throw new Error('consume 越界');
    this.bufLen -= n;
    if (this.bufLen > 0) this.buf.copyWithin(0, n, n + this.bufLen);
  }

  get eof() { return this.filePos >= this.file.size && this.bufLen === 0; }
  get remaining() { return this.bufLen + (this.file.size - this.filePos); }
  peekByte() { return this.bufLen > 0 ? this.buf[0] : null; }

  async readByte() {
    await this._fill(1);
    const v = this.buf[0];
    this._consume(1);
    return v;
  }

  async readInt() { // big-endian signed 32
    await this._fill(4);
    const v = new DataView(this.buf.buffer, this.buf.byteOffset, 4).getInt32(0, false);
    this._consume(4);
    return v;
  }

  async readLong() { // big-endian signed 64 -> BigInt
    await this._fill(8);
    const v = new DataView(this.buf.buffer, this.buf.byteOffset, 8).getBigInt64(0, false);
    this._consume(8);
    return v;
  }

  async readUnsignedShort() { // big-endian unsigned 16
    await this._fill(2);
    const v = new DataView(this.buf.buffer, this.buf.byteOffset, 2).getUint16(0, false);
    this._consume(2);
    return v;
  }

  async readUTF() {
    const len = await this.readUnsignedShort();
    if (len < 0 || len > 1 << 20) throw new Error('UTF 长度异常: ' + len);
    await this._fill(len);
    // Java DataOutputStream.writeUTF 使用 Modified UTF-8：
    // - null 字节编码为 0xC0 0x80（而非 0x00）
    // - 补充字符用 CESU-8 风格（两个 3 字节 surrogate pair，共 6 字节）
    // 手动解码以正确处理这些差异
    const str = decodeModifiedUtf8(this.buf, 0, len);
    this._consume(len);
    return str;
  }

  snapshot() {
    return {
      filePos: this.filePos,
      buf: new Uint8Array(this.buf.subarray(0, this.bufLen)),
      bufLen: this.bufLen,
      capacity: this.buf.length
    };
  }

  restore(s) {
    this.filePos = s.filePos;
    this.buf = s.buf;
    this.bufLen = s.bufLen;
    this.capacity = s.capacity;
  }
}

// ============================================================
// 解析整个文件
// 格式（Java save 方法）：
//   1. int size - BufTree 条目数量
//   2. 每个条目：long threadId, int max, int empty, long[] call, int[] time, int[] thisnext, int[] callnext
//   3. 字符串表：byte flag(1) + UTF string + int id，以 flag=0 结束
// ============================================================
async function loadFile(file, onProgress, onError) {
  const reader = new StreamReader(file);
  const threads = [];
  const stringTable = [];
  const diag = { byteOffset: 0, threads: 0, strings: 0, warnings: [], startOffset: 0 };

  const updateDiag = () => {
    diag.byteOffset = reader.filePos - reader.bufLen;
    onProgress(`offset=${diag.byteOffset} threads=${diag.threads} strings=${diag.strings}` +
      (diag.warnings.length ? ' ' + diag.warnings.join('; ') : ''));
  };

  onProgress('开始解析...');
  await sleep(0);

  // 读取 BufTree 条目数量
  const size = await reader.readInt();
  if (size < 0 || size > 100000) {
    throw new Error('BufTree 数量异常: ' + size + '（文件可能不是 raw 格式，请确认已从 zip 中解压）');
  }
  onProgress(`BufTree 数量: ${size}`);
  await sleep(0);

  // 逐个读取 BufTree
  for (let idx = 0; idx < size; idx++) {
    if (reader.remaining < 16) {
      throw new Error(`文件意外结束：还需读取 ${size - idx} 个 BufTree`);
    }

    const threadId = await reader.readLong();
    const max = await reader.readInt();
    const empty = await reader.readInt();

    if (max < 0 || max > 1e9) throw new Error(`BufTree[${idx}] max 异常: ${max}`);
    if (empty < 0 || empty > max) throw new Error(`BufTree[${idx}] empty 异常: ${empty}`);

    let threadName;
    try {
      const hasThreadName = await reader.readByte();
      if (hasThreadName) threadName = await reader.readUTF();
    } catch (e) {
      // 旧格式或数据异常：当作没有线程名
    }

    onProgress(`线程 ${idx + 1}/${size} (id=${threadId}, max=${max})…`);
    await sleep(0);

    const totalBytes = max * (8 + 4 + 4 + 4);
    if (totalBytes > 0) {
      await reader._fill(totalBytes);

      const calls = new Array(max);
      const times = new Int32Array(max);
      const thisnext = new Int32Array(max);
      const callnext = new Int32Array(max);

      let off = reader.buf.byteOffset;

      for (let i = 0; i < max; i++) {
        calls[i] = new DataView(reader.buf.buffer, off + i * 8, 8).getBigInt64(0, false);
      }
      off += max * 8;
      for (let i = 0; i < max; i++) {
        times[i] = new DataView(reader.buf.buffer, off + i * 4, 4).getInt32(0, false);
      }
      off += max * 4;
      for (let i = 0; i < max; i++) {
        thisnext[i] = new DataView(reader.buf.buffer, off + i * 4, 4).getInt32(0, false);
      }
      off += max * 4;
      for (let i = 0; i < max; i++) {
        callnext[i] = new DataView(reader.buf.buffer, off + i * 4, 4).getInt32(0, false);
      }

      reader._consume(totalBytes);
      threads.push({ threadId, max, empty, threadName, calls, times, thisnext, callnext });
    } else {
      threads.push({ threadId, max, empty, threadName, calls: [], times: new Int32Array(0), thisnext: new Int32Array(0), callnext: new Int32Array(0) });
    }
    diag.threads++;
    updateDiag();
  }

  // 读取字符串表
  onProgress('读取字符串表…');
  await sleep(0);
  while (!reader.eof) {
    const flag = await reader.readByte();
    if (flag === 0) break;
    const str = await reader.readUTF();
    const id = await reader.readInt();
    if (id >= 0 && id < 1 << 24) stringTable[id] = str;
    diag.strings++;
  }

  // 读取采样速度日志（新格式：int speedSize + speedSize × (long timeMs, int rate)）
  const speedLog = [];
  try {
    if (reader.remaining >= 4) {
      const speedSize = await reader.readInt();
      if (speedSize > 0 && speedSize < 1 << 20) {
        for (let i = 0; i < speedSize; i++) {
          const timeMs = await reader.readLong();
          const rate = await reader.readInt();
          speedLog.push({ timeMs: Number(timeMs), rate });
        }
      }
    }
  } catch (e) {
    // 旧格式文件没有速度日志
  }

  updateDiag();
  onProgress(`完成：${threads.length} 个线程，${stringTable.length} 个字符串` + (speedLog.length ? `，速度日志 ${speedLog.length} 条` : ''));
  return { threads, stringTable, diag, speedLog };
}

// ============================================================
// 渲染：树节点（懒渲染，折叠时不创建子节点）
// ============================================================
function methodLabel(call, stringTable) {
  // call = ((BigInt)cni << 32) | (BigInt)(mni & 0xFFFFFFFF)
  // 使用无符号掩码确保正确解码
  const cni = Number((call >> 32n) & 0xFFFFFFFFn);
  const mni = Number(call & 0xFFFFFFFFn);
  const cn = stringTable[cni];
  const mn = stringTable[mni];
  if (cn === undefined && mn === undefined) {
    return `?c${cni}.?m${mni}`;
  }
  return (cn ?? '?c' + cni) + '.' + (mn ?? '?m' + mni);
}

function buildNode(idx, tree, stringTable, isRoot) {
  const div = document.createElement('div');
  div.className = 'tree-node' + (isRoot ? ' root' : '');

  const content = document.createElement('div');
  content.className = 'tree-node-content';

  const childIdx = Number(tree.callnext[idx]);
  const hasChildren = childIdx >= 0;

  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = hasChildren ? '▶' : '·';
  content.appendChild(toggle);

  if (isRoot) {
    const sp = document.createElement('span');
    sp.className = 'method';
    const rootCount = tree.times[idx];
    sp.textContent = `(root) 调用${rootCount}次`;
    content.appendChild(sp);
  } else {
    const label = methodLabel(tree.calls[idx], stringTable);
    const sp = document.createElement('span');
    sp.className = 'method';
    sp.textContent = label;
    content.appendChild(sp);
    const ct = document.createElement('span');
    ct.className = 'count';
    ct.textContent = '(' + tree.times[idx] + ')';
    content.appendChild(ct);
  }

  div.appendChild(content);

  if (hasChildren) {
    div.classList.add('collapsed');
    const children = document.createElement('div');
    children.className = 'tree-children';
    content.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!children.dataset.rendered) {
        // 收集所有子节点（通过 thisnext 链表）
        const childNodes = [];
        let cur = childIdx;
        const visited = new Set();
        while (cur >= 0 && !visited.has(cur)) {
          if (cur >= tree.empty || cur === 0) break; // 只遍历有效节点，跳过根节点(0)
          visited.add(cur);
          childNodes.push(cur);
          cur = tree.thisnext[cur];
        }
        // 渲染子节点
        for (const cIdx of childNodes) {
          children.appendChild(buildNode(cIdx, tree, stringTable, false));
        }
        children.dataset.rendered = '1';
      }
      div.classList.toggle('collapsed');
      toggle.textContent = div.classList.contains('collapsed') ? '▶' : '▼';
    });
    div.appendChild(children);
  } else {
    content.addEventListener('click', (e) => e.stopPropagation());
  }

  return div;
}

// 调试：显示树结构
function debugTree(tree, stringTable) {
  const lines = [];
  function traverse(idx, depth) {
    if (idx < 0 || idx >= tree.empty) return;
    const label = methodLabel(tree.calls[idx], stringTable);
    lines.push('  '.repeat(depth) + `${idx}: ${label} (times=${tree.times[idx]}, callnext=${tree.callnext[idx]}, thisnext=${tree.thisnext[idx]})`);
    const childIdx = Number(tree.callnext[idx]);
    if (childIdx >= 0 && childIdx < tree.empty) {
      let cur = childIdx;
      const visited = new Set();
      while (cur >= 0 && !visited.has(cur)) {
        if (cur >= tree.empty) break;
        visited.add(cur);
        traverse(cur, depth + 1);
        cur = tree.thisnext[cur];
      }
    }
  }
  traverse(0, 0);
  return lines.join('\n');
}

// ============================================================
// 渲染整个文件
// ============================================================
function renderFile(file, result, container) {
  const { threads, stringTable, speedLog } = result;
  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'file-header';
  const h2 = document.createElement('h2');
  h2.textContent = file.name;
  const st = speedStats(speedLog);
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = `${formatSize(file.size)} · ${threads.length} 线程 · ${stringTable.length} 字符串` +
    (st ? ` · 记录速度：平均 ${st.avg} 次/秒` : '');
  header.appendChild(h2);
  header.appendChild(meta);
  container.appendChild(header);

  container.appendChild(renderSpeed(speedLog));

  const list = document.createElement('div');
  list.className = 'threads';
  container.appendChild(list);

  if (threads.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'legend';
    empty.textContent = '（文件中没有线程数据）';
    list.appendChild(empty);
    return;
  }

  // 按 threadId 排序（BigInt 安全比较）
  const sorted = threads.slice().sort((a, b) => {
    if (a.threadId < b.threadId) return -1;
    if (a.threadId > b.threadId) return 1;
    return 0;
  });

  for (const tree of sorted) {
    const tdiv = document.createElement('div');
    tdiv.className = 'thread';

    const thead = document.createElement('div');
    thead.className = 'thread-header';
    const title = document.createElement('span');
    title.textContent = tree.threadName
      ? `线程 #${tree.threadId.toString()}: ${tree.threadName}`
      : '线程 #' + tree.threadId.toString();
    const tmeta = document.createElement('span');
    tmeta.className = 'thread-meta';
    tmeta.textContent = `max=${tree.max}, empty=${tree.empty}`;
    thead.appendChild(title);
    thead.appendChild(tmeta);
    thead.addEventListener('click', () => tdiv.classList.toggle('collapsed'));
    tdiv.appendChild(thead);

    const tbody = document.createElement('div');
    tbody.className = 'thread-body';
    // 初始只渲染根节点，子节点懒渲染
    tbody.appendChild(buildNode(0, tree, stringTable, true));
    tdiv.appendChild(tbody);

    list.appendChild(tdiv);
  }
}

$('zoom-in').onclick = () => setZoom(zoomLevel * 1.2);
$('zoom-out').onclick = () => setZoom(zoomLevel / 1.2);
$('zoom-reset').onclick = () => setZoom(1);

$('collapse-all').onclick = () => {
  document.querySelectorAll('.tree-node').forEach(n => {
    n.classList.add('collapsed');
    const t = n.querySelector(':scope > .tree-node-content > .toggle');
    if (t) t.textContent = '▶';
  });
  document.querySelectorAll('.thread').forEach(t => t.classList.add('collapsed'));
};

$('expand-all-1').onclick = () => {
  // 仅展开第一层（根的直接子节点）—— 由于懒渲染，需要点一下根才会创建子节点
  document.querySelectorAll('.thread').forEach(t => t.classList.remove('collapsed'));
  document.querySelectorAll('.thread-body > .tree-node.root > .tree-node-content').forEach(c => c.click());
};

$('expand-all').onclick = () => {
  // 全展开：对所有可见的折叠节点逐个点击
  // 注意：懒渲染模式下需要先把根展开，然后递归
  const allThreads = document.querySelectorAll('.thread');
  allThreads.forEach(t => t.classList.remove('collapsed'));
  const rootContents = document.querySelectorAll('.thread-body > .tree-node.root > .tree-node-content');
  rootContents.forEach(c => c.click());
  // 之后批量展开所有 .tree-node
  let safety = 0;
  while (safety++ < 100000) {
    const collapsed = document.querySelectorAll('.tree-node.collapsed > .tree-node-content');
    if (collapsed.length === 0) break;
    collapsed.forEach(c => c.click());
  }
};

$('debug-tree').onclick = () => {
  const firstThread = document.querySelector('.thread');
  if (!firstThread) {
    alert('没有线程数据');
    return;
  }
  // 找到第一个线程的 tree 对象（从 result 中获取）
  // 由于 renderFile 没有保存引用，我们从 DOM 反推
  const threadsDiv = document.querySelector('.threads');
  if (threadsDiv && window._lastResult) {
    const { threads, stringTable } = window._lastResult;
    if (threads.length > 0) {
      const debugText = debugTree(threads[0], stringTable);
      const win = window.open('', '_blank', 'width=800,height=600');
      win.document.write('<pre style="font-size:12px;font-family:Consolas,monospace;">' + escapeHtml(debugText) + '</pre>');
    }
  }
};



document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(zoomLevel * 1.2); }
    else if (e.key === '-') { e.preventDefault(); setZoom(zoomLevel / 1.2); }
    else if (e.key === '0') { e.preventDefault(); setZoom(1); }
  }
});

async function handleFiles(files) {
  const arr = Array.from(files);
  if (!arr.length) return;
  $('content').innerHTML = '';
  for (const file of arr) {
    const sec = document.createElement('div');
    sec.className = 'file-section';
    sec.innerHTML = `<div class="progress">${escapeHtml(file.name)}：排队中…</div>`;
    $('content').appendChild(sec);
  }
  for (let i = 0; i < arr.length; i++) {
    const file = arr[i];
    const sec = $('content').children[i];
    const warns = [];
    const onProg = (msg) => {
      sec.innerHTML = `<div class="progress">${escapeHtml(file.name)}：${escapeHtml(msg)}</div>`;
    };
    const onWarn = (msg) => {
      warns.push(msg);
      onProg(warns[warns.length - 1]);
    };
    try {
      $('status').textContent = `解析 ${file.name}`;
      const result = await loadFile(file, onProg, onWarn);
      window._lastResult = result;
      $('status').textContent = `${file.name} 完成`;
      renderFile(file, result, sec);
    } catch (err) {
      console.error(err);
      const hex = await hexDump(file, 128);
      sec.innerHTML =
        `<div class="error">${escapeHtml(file.name)} 解析失败：${escapeHtml(err.message || String(err))}</div>` +
        `<details><summary>前 128 字节（hex）</summary><pre style="font-size:11px;overflow:auto;background:#f5f5f5;padding:8px;margin:4px 0;">${escapeHtml(hex)}</pre></details>`;
      $('status').textContent = `${file.name} 失败`;
    }
  }
}

// 取文件前 n 字节的 hex 展示（用于诊断）
async function hexDump(file, n) {
  const slice = file.slice(0, Math.min(n, file.size));
  const buf = new Uint8Array(await slice.arrayBuffer());
  const lines = [];
  for (let i = 0; i < buf.length; i += 16) {
    const hex = Array.from(buf.subarray(i, i + 16), b => b.toString(16).padStart(2, '0')).join(' ');
    const ascii = Array.from(buf.subarray(i, i + 16), b => (b >= 0x20 && b < 0x7F) ? String.fromCharCode(b) : '.').join('');
    lines.push(`${i.toString(16).padStart(8, '0')}  ${hex.padEnd(48, ' ')}  ${ascii}`);
  }
  return lines.join('\n');
}

$('file-input').addEventListener('change', (e) => {
  handleFiles(e.target.files);
  e.target.value = ''; // 允许重选同一文件
});

// 拖放支持
const dz = $('drop-zone');
['dragenter', 'dragover'].forEach(ev => {
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    if (dz) dz.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(ev => {
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    if (dz && ev === 'dragleave' && e.target !== dz) return;
    if (dz) dz.classList.remove('dragover');
  });
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});

// 初始
setZoom(1);
